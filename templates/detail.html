<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | Time To Talk</title>
  <style>
    body {
      margin: 0;
      font-family: 'Vazirmatn', sans-serif;
      background: #a2c48d; /* رنگ بک‌گراند مثل صفحه اصلی */
      color: #222;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 40px;
      background: #a2c48d;
    }
    .logo img {
      height: 50px;
    }
    .search-box {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      width: 320px;
    }
    .search-box input {
      border: none;
      padding: 8px 12px;
      outline: none;
      flex: 1;
    }
    .search-box button {
      background: #466b44;
      color: #fff;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #333;
    }
    .btn-outline {
      border: 2px solid #fff;
      background: transparent;
      padding: 6px 16px;
      border-radius: 20px;
      color: #fff;
      cursor: pointer;
    }

    /* Product Details */
    .product-details {
      display: flex;
      flex-wrap: wrap;
      padding: 40px;
      background: #d8e7d1;
      border-radius: 20px;
      margin: 30px auto;
      max-width: 1100px;
      gap: 30px;
    }
    .product-image img {
      width: 400px;
      border-radius: 12px;
    }
    .product-info {
      max-width: 600px;
    }
    .product-info h1 {
      font-size: 28px;
    }
    .price {
      font-size: 20px;
      font-weight: bold;
      color: #1e3e1e;
    }
    .desc {
      margin: 15px 0;
      line-height: 1.8;
    }
    .btn-buy {
      background: #466b44;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
    }

    /* Related Products */
    .related-products {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
    }
    .related-products h2 {
      margin-bottom: 20px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      width: 100%;
      border-radius: 10px;
    }
    .card h3 {
      margin: 10px 0 5px;
    }
    .card p {
      color: #466b44;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img src="logo.png" alt="Logo">
    </div>
    <div class="search-box">
      <input type="text" placeholder="Search Podcast">
      <button>🔍</button>
    </div>
    <nav>
      <a href="#">خانه</a>
      <a href="#">دسته بندی</a>
      <a href="#">درباره ما</a>
      <a href="#">ارتباط با ما</a>
    </nav>
    <button class="btn-outline">Get started</button>
  </header>

  <!-- Product Details -->
  <section class="product-details">
    <div class="product-image">
      <img src="product1.jpg" alt="شلوار جین">
    </div>
    <div class="product-info">
      <h1>شلوار جین</h1>
      <p class="price">850,000 تومان</p>
      <p class="desc">
        این شلوار جین از بهترین متریال تولید شده و طراحی خاصی دارد
        که برای کسانی که به استایل خود اهمیت می‌دهند مناسب است.
      </p>
      <button class="btn-buy" id="buyBtn">همین حالا خرید کنید</button>
    </div>
  </section>

  <!-- Related Products -->
  <section class="related-products">
    <h2>محصولات مرتبط</h2>
    <div class="products-grid">
      <div class="card">
        <img src="product2.jpg" alt="پیراهن زارا">
        <h3>پیراهن زارا</h3>
        <p>650,000 تومان</p>
      </div>
      <div class="card">
        <img src="product3.jpg" alt="تیشرت مشکی">
        <h3>تیشرت مشکی</h3>
        <p>400,000 تومان</p>
      </div>
    </div>
  </section>

  <script>
    document.getElementById("buyBtn").addEventListener("click", () => {
      alert("محصول به سبد خرید اضافه شد!");
    });
  </script>
</body>
</html>
